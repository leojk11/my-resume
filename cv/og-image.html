<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for public/og-image.png (the link-preview image). Rendered at 1200x630 with headless Edge. -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 90px;
    box-sizing: border-box;
    background:
      radial-gradient(circle at 0% 0%, rgba(0, 240, 255, 0.18), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(255, 43, 214, 0.18), transparent 45%),
      #04050d;
    color: #e7ecff;
    font-family: 'Space Grotesk', sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .photo {
    position: relative;
    flex-shrink: 0;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #00f0ff, #ff2bd6);
    box-shadow: 0 0 80px rgba(0, 240, 255, 0.25);
  }
  .photo div {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: url('../public/me.webp') 52% 22% / 190% auto no-repeat, #080b1a;
    border: 6px solid #04050d;
    box-sizing: border-box;
  }
  .text { position: relative; }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    color: #00f0ff;
    margin-bottom: 26px;
  }
  h1 {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 64px;
    line-height: 1.08;
  }
  .role {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    background: linear-gradient(100deg, #00f0ff, #ff2bd6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .meta { margin-top: 26px; font-size: 24px; color: #8a93b8; }
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 8px;
    background: linear-gradient(90deg, #00f0ff, #ff2bd6);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="photo"><div></div></div>
  <div class="text">
    <div class="logo">&lt;LJ/&gt;</div>
    <h1>Leonid<br>Jakimovski</h1>
    <div class="role">Senior Software Developer</div>
    <div class="meta">Angular · Skopje, North Macedonia</div>
  </div>
  <div class="bar"></div>
</body>
</html>
